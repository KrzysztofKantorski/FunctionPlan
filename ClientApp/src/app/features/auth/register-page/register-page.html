<auth-layout>
    <div class="w-full max-w-sm">
        <main-header>
            Register
        </main-header>

        <div class="flex flex-col gap-5">
            <form-input type="text" placeholder="Username"></form-input>
            <form-input type="email" placeholder="Email"></form-input>
            <form-input type="password" placeholder="Password"></form-input>

            <div class="mt-2">
                 <action-button routerLink="/verify">
                    Register
                </action-button>
            </div>
            
            <google-btn></google-btn>
        </div>
    </div>
</auth-layout>
