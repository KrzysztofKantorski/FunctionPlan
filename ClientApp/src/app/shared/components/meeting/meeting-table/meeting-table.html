
    <table mat-table [dataSource]="dataSource" matSort class="w-full bg-transparent">

      <!-- Title Column -->
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="!text-on-surface font-semibold"> Title </th>
        <td mat-cell *matCellDef="let row" class="!text-on-surface font-medium"> {{ row.title }} </td>
      </ng-container>

      <!-- Date Column -->
      <ng-container matColumnDef="scheduledFor">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="!text-on-surface font-semibold"> Date </th>
        <td mat-cell *matCellDef="let row" class="!text-on-surface-variant text-sm"> 
          {{ row.scheduledFor | date:'dd.MM.yyyy HH:mm' }} 
        </td>
      </ng-container>

      <!-- Organizer Column -->
      <ng-container matColumnDef="organizerName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="!text-on-surface font-semibold"> Organizer </th>
        <td mat-cell *matCellDef="let row" class="!text-on-surface-variant"> 
          {{ row.organizerName }} 
        </td>
      </ng-container>


      <!-- Edit / Delete for organized meetings -->
      <ng-container matColumnDef="manage-actions">
        <th mat-header-cell *matHeaderCellDef class="text-right">Actions</th>
        <td mat-cell *matCellDef="let row" class="text-center">
          <div class="flex justify-start gap-1">
            <button mat-icon-button class="text-primary hover:bg-primary/10" (click)="onEdit($event, row.id)" title="Edit meeting">
              <mat-icon class="!text-[20px] !w-5 !h-5 leading-5">edit</mat-icon>
            </button>
            <button mat-icon-button class="text-error hover:bg-error/10" (click)="onDelete($event, row.id)" title="Delete meeting">
              <mat-icon class="!text-[20px] !w-5 !h-5 leading-5">delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>


      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="text-right">Details</th>
        <td mat-cell *matCellDef="let row" class="text-right">
          <button mat-icon-button color="primary" (click)="goToMeeting(row.id)">
            <mat-icon>chevron_right</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-surface-variant/40 transition"></tr>

     
    </table>
