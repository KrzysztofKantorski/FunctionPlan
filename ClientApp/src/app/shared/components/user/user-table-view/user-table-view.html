<table mat-table [dataSource]="dataSource" matSort class="w-full bg-transparent mt-[5rem]">

    <!-- User avatar -->
    <ng-container matColumnDef="avatar">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="!text-on-surface font-semibold"> Avatar </th>
            <td mat-cell *matCellDef="let row" class="!text-on-surface font-medium">
                <user-avatar 
                    [userId]="row.id" 
                    [username]="row.username" 
                    [profilePictureUrl]="row.profilePictureUrl">
                </user-avatar>
            </td>
        </ng-container>

    <!-- Username -->
    <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="!text-on-surface font-semibold"> Username </th>
        <td mat-cell *matCellDef="let row" class="!text-on-surface-variant text-sm"> 
          {{ row.username }} 
        </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="text-right">Actions</th>
        <td mat-cell *matCellDef="let row" class="text-right">
          <button mat-icon-button color="primary" (click)="navigateToUserDetails(row.id)">
            <mat-icon>chevron_right</mat-icon>
          </button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-surface-variant/40 transition"></tr>

     
</table>
