@if(profilePictureUrl)
{
    <img [src]="profilePictureUrl" [alt]="username" 
    (error)="onAvatarError($event)"
    class="opacity-95 w-10 h-10 rounded-full object-cover cursor-pointer hover:opacity-100 transition" />
}
@else
{
    <div class="opacity-95 w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center font-bold 
    text-on-surface-variant cursor-pointer hover:opacity-100 transition">
        {{ username.charAt(0).toUpperCase() }}
    </div>
}
