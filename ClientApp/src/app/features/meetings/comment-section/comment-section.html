<div class="flex flex-col items-center w-[80%] m-auto h-screen flex-col font-sans gap-5">
    <comment-header></comment-header>

    <!-- New comment form -->
    @if(currentUser$ | async; as user)
    {
        <div class="flex gap-3 items-center">
            <div (click)="openParticipantDetails(user)" class="relative rounded-full ring-2 ring-white cursor-pointer hover:z-10 transition-transform hover:scale-105">
                <user-avatar
                    [userId]="user.id"
                    [username]="user.username">
                </user-avatar>
            </div>

            <comment-form
                [meetingId]="meetingId" 
                (commentAdded)="onCommentAdded()"
            >
            </comment-form>
        </div>


        <div>
            @if (comments$ | async; as comments) 
            {
                @for(comment of comments; track comment.id)
                {
                  <comment-tree [comment]="comment"></comment-tree>
                }
                @empty{
                    <empty-comments></empty-comments>
                }
            }   
            @else 
            {
                <div>Loading comments...</div>
            }
        </div>
    }
   
</div>
