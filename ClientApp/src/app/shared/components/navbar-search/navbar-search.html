<div class="flex items-center bg-white rounded-full px-4 py-2 w-full max-w-md  transition-all ">
  
  <mat-icon class="text-gray-500 mr-2">search</mat-icon>
  
  <input 
    type="text" 
    [formControl]="searchControl" 
    placeholder="Search meetings..."
    class="flex-1 bg-transparent border-none outline-none text-gray-800 placeholder-gray-500"
  >
  
  @if (searchControl.value) {
    <button 
      aria-label="Clear" 
      (click)="clearSearch()" 
      class="flex items-center justify-center text-gray-400 hover:text-gray-700 transition-colors"
    >
      <mat-icon>close</mat-icon>
    </button>
  }
</div>
