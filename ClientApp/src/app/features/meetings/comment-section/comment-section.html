<div class="flex flex-col items-center w-[50%] m-auto h-screen flex-col font-sans gap-5">
    <comment-header></comment-header>

    <!-- New comment form -->
    @if(currentUser$ | async; as user)
    {
        <div class="flex gap-3 items-center w-full p-4 rounded-lg bg-primary-container">
            <div (click)="openParticipantDetails(user)" class="relative rounded-full ring-2 ring-white cursor-pointer shrink-0 hover:z-10 transition-transform hover:scale-105">
                <user-avatar
                    [userId]="user.id"
                    [username]="user.username">
                </user-avatar>
            </div>

            <comment-form
                class="flex-1 min-w-0"
                [meetingId]="meetingId" 
                (commentAdded)="onCommentAdded()"
            >
            </comment-form>
        </div>
        <div class="h-0 w-[98%] border-2 border-solid border-primary"></div>

        
    }



    <div class="w-full">
        @if (comments$ | async; as comments) 
        {
            @for(comment of comments; track comment.id)
            {
                <comment-tree [comment]="comment"></comment-tree>
            }
            @empty{
                <empty-comments></empty-comments>
            }
        }   
        @else 
        {
            <div>Loading comments...</div>
        }
    </div>
   
</div>
