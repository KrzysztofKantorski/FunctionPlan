<auth-layout>
    <div class="w-full max-w-sm">
        <main-header>
            Login
        </main-header>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
            <form-input formControlName="email" type="email" placeholder="Email"></form-input>
            <form-input formControlName="password" type="password" placeholder="Password"></form-input>

            <div class="mt-2">
                <action-button type="submit">Login</action-button>
            </div>
            
            <google-btn></google-btn>
        </form>
    </div>
</auth-layout>
