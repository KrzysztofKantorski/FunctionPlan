<div class="flex h-screen flex-col bg-background font-sans overflow-hidden">
    <nav class="bg-secondary text-white p-4 flex justify-between">
      @if(userProfile$ |  async; as user)
      {
          <div class="flex items-center gap-4">
            <span>{{user.username}}</span>
            <span>{{user.email}}</span>
          </div>
      }
    </nav>

    <div class="flex flex-1 overflow-hidden">
    
    <!-- Sidebar -->
    <div class="w-64 flex-shrink-0 bg-on-primary overflow-y-auto"></div>

    <!-- Meetings Grid -->
    <main class="flex-1 overflow-y-auto p-10">
      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8">
        <div>meeting</div>
      </div>
    </main>

  </div>
</div>
