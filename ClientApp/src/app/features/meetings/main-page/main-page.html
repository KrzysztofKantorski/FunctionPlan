<div class="flex h-screen flex-col bg-background font-sans overflow-hidden">
    <navbar>
      <navbar-btn-group></navbar-btn-group>
      <navbar-search></navbar-search>
      <user-menu></user-menu>
    </navbar>

    <div class="flex flex-1 overflow-hidden">
    
    <!-- Sidebar -->
    <div class="w-64 flex-shrink-0 bg-primary-container overflow-y-auto relative">
      <sidebar (filtersChanged)="onFiltersUpdated($event)"></sidebar>

      <button 
        mat-flat-button 
        class="!p-5 !text-lg !w-[90%] !bg-on-primary !text-on-primary-container !rounded-none text-center !absolute bottom-5 left-[5%]"
      >
        Schedule meeting
      </button>
    </div>

    <!-- Meetings Grid -->
    <main class="flex-1 overflow-y-auto p-10">
        @if(meetings$ | async; as meetings)
        {
          <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8">
              @for(meeting of meetings; track meeting.Id)
              {
                <div class="p-4 border rounded shadow-sm bg-white">
                  <h3>{{ meeting.Title }}</h3>
                  <h3>{{ meeting.ScheduledFor }}</h3>
                  
                </div>
              }
          </div>
        }
    </main>

  </div>
</div>
